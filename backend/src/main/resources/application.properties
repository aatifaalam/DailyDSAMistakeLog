spring.application.name=dsa-mistake-log-backend
server.port=8080

# Database Configuration with support for standard env variables
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dsa_mistake_log?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_ORIGIN:${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}}

# JWT Configuration (Secret must be at least 256 bits for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Seeding & Migration
app.seed-data.enabled=${APP_SEED_DATA_ENABLED:true}
app.security.migration-owner-email=${MIGRATION_OWNER_EMAIL:system@dsamistakelog.com}
